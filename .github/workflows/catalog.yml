name: Build catalog

# The whole point of this repo: upload a PDF to books/ and the index follows.
# This runs tools/build_catalog.mjs, which reads every PDF, fills the gaps from
# metadata, filename and Open Library, and rewrites main/catalog.json.

on:
  push:
    branches: [main]
    paths:
      - "books/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/catalog.yml"
  pull_request:
    paths:
      - "books/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # On a pull request we only verify. build_catalog leaves the file alone
      # when the content already matches, so `--check` is a true gate.
      - name: Verify the catalog is current
        if: github.event_name == 'pull_request'
        run: npm run check

      # On a push we rebuild and commit whatever changed (a new PDF, a removed
      # one, new Open Library detail). generatedAt only moves when content does.
      - name: Rebuild and commit
        if: github.event_name != 'pull_request'
        run: |
          npm run build
          if git diff --quiet -- main/catalog.json tools/ol-cache.json; then
            echo "catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/catalog.json tools/ol-cache.json
          git commit -m "chore: rebuild catalog"
          git push
